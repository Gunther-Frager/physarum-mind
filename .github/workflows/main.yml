name: Latido del Slime Mold

on:
  schedule:
    # ⏰ FRECUENCIA DE EJECUCIÓN - Edita el cron aquí:
    # '0 * * * *'     → Cada hora (24 ciclos/día) - MÁS PENSAMIENTO
    # '0 */2 * * *'   → Cada 2 horas (12 ciclos/día)
    # '0 */6 * * *'   → Cada 6 horas (4 ciclos/día)
    # '0 */12 * * *'  → Cada 12 horas (2 ciclos/día)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite activar manualmente con un botón en GitHub

jobs:
  think:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Permiso crucial para que el agente pueda escribir notas
      issues: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install google-generativeai sentence-transformers numpy

      - name: Ejecutar Agente de Pensamiento Autónomo
        env:
          # Variables de entorno con tokens de seguridad (configurados en GitHub Secrets)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Para leer/escribir issues
        run: python slime_agent.py

      - name: Procesar Issues como Nuevas Notas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python github_issues_manager.py --import
        continue-on-error: true  # No falla el workflow si no hay issues

      - name: Publicar Síntesis Interesantes como Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python github_issues_manager.py --publish
        continue-on-error: true  # No falla el workflow si no hay síntesis nuevas

      - name: Generar Dashboard Web
        run: python dashboard_generator.py
        continue-on-error: true

      - name: Guardar cambios, notas nuevas y síntesis
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "🧠 Slime Mold Agent"
          git add .
          git commit -m "🌱 Ciclo de pensamiento completado: nuevas conexiones, síntesis e ideas" || echo "✓ Sin cambios nuevos"
          git push